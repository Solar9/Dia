<script>

const taskData=[{title:'Zapamiętywanie rozmiaru okna',project:'Dia',state:'review',label:'Do sprawdzenia',agent:'Claude Code',time:'4 min temu',desc:'Okno wraca do ostatniego rozmiaru i położenia. Ustawienia zapisują się po zmianie geometrii, również przy zamknięciu do zasobnika.'},{title:'Uproszczenie ustawień głosu',project:'Dia',state:'running',label:'W trakcie',agent:'Codex',time:'2 min 18 s',desc:'Agent porządkuje ustawienia głosu i sprawdza dostępność urządzeń. Wynik będzie gotowy do przeglądu po zakończeniu zadania.'},{title:'Przegląd obsługi sesji CLI',project:'Dia',state:'review',label:'Do sprawdzenia',agent:'Codex',time:'12 min temu',desc:'Przegląd obsługi przejmowania i zwalniania sesji CLI. Raport z uwagami czeka na przeczytanie.'},{title:'Weryfikacja motywu jasnego',project:'Dia',state:'done',label:'Zakończone',agent:'Claude Code',time:'38 min temu',desc:'Przykładowe zakończone zadanie: weryfikacja kontrastu i stanów kontrolek w jasnym motywie.'}];
function nav(id,label,icon,count=''){return `<button class="nav ${view===id?'active':''}" ${view===id?'aria-current="page"':''} aria-label="${label}" data-view="${id}">${I(icon)}<span class="nav-text">${label}</span>${count?`<span class="count">${count}</span>`:''}</button>`}
function render(){document.querySelector('#toast').hidden=true;document.querySelector('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><img src="${logo}" alt=""><b class="brand-name">dia</b><span>WORKSPACE</span></div><div class="nav-label">PRZESTRZEŃ PRACY</div>${nav('tasks','Zadania','grid','4')}${nav('missions','Misje','target')}${nav('chat','Rozmowy','chat')}${nav('cli','Sesje CLI','terminal','2')}<div class="nav-label" style="margin-top:28px">WIEDZA I SYSTEM</div>${nav('memory','Pamięć','book')}${nav('status','Status','activity')}${nav('usage','Wykorzystanie','chart')}<div class="sidebar-bottom">${nav('settings','Ustawienia','settings')}<button class="voice" data-demo="Tryb głosowy — podgląd wyglądu przycisku."><span class="orb">${I('mic')}</span><span><b>Porozmawiaj z Dią</b><small>Głos gotowy do rozmowy</small></span></button><div class="connection"><i class="dot"></i> Dia lokalnie <span>DEMO</span></div></div></aside><main><header class="topbar"><span class="workspace">Osobista przestrzeń</span><span class="slash">/</span><strong>${{tasks:'Zadania',chat:'Rozmowy',settings:'Ustawienia'}[view]}</strong><div class="topbar-right"><button class="search-trigger" data-action="search" style="color:var(--dim);font-size:11px">${I('search')} Szukaj <span class="key">Ctrl K</span></button><button class="icon" data-action="theme" aria-label="Zmień motyw">${I('sun')}</button><button class="icon" data-demo="W makiecie nie ma nowych powiadomień." aria-label="Powiadomienia">${I('bell')}</button><div class="avatar">S</div></div></header>${view==='tasks'?tasks():view==='chat'?chat():settings()}</main></div>`;bind()}
function tasks(){return `<section class="page"><div class="heading"><div><div class="eyebrow">TWOJE CENTRUM PRACY</div><h1>Mniej pilnowania. Więcej tworzenia.</h1><p>Dia pracuje w tle. Dwa zadania czekają na Twoją decyzję.</p></div><button class="btn primary" data-action="new">${I('plus')} Nowe zadanie</button></div><div class="stats">${[['Do sprawdzenia','2','Czekają na Twoją decyzję','check','attention'],['W trakcie','1','Codex pracuje nad zadaniem','activity',''],['Zakończone dzisiaj','8','W tym 1 zadanie na liście','grid',''],['Czas agentów','42 min','Dzisiejsze wykorzystanie','clock','']].map(([name,note,caption,icon,cls])=>`<div class="stat ${cls}"><div class="stat-top">${name}${I(icon)}</div><div class="stat-number">${note}</div><small>${caption}</small></div>`).join('')}</div><div class="toolbar"><div class="tabs" aria-label="Filtr zadań">${[['all','Wszystkie','4'],['review','Do sprawdzenia','2'],['running','W trakcie','1'],['done','Zakończone','1']].map(([id,title,n])=>`<button class="tab ${filter===id?'active':''}" data-filter="${id}" aria-pressed="${filter===id}">${title}<span>${n}</span></button>`).join('')}</div><label class="search">${I('search')}<input id="task-search" placeholder="Szukaj zadania…" aria-label="Szukaj zadania" value="${escapeHTML(query)}"></label></div><div class="workgrid"><div><div class="tasklist" id="tasklist">${taskRows()}</div><div class="list-caption">Ostatnie zadania · projekt Dia</div></div><article class="detail" id="detail">${detail()}</article></div><footer class="footer"><span class="demo-label">Koncepcja UI · przykładowe dane</span><span>Spokojniejszy interfejs. Wyraźniejszy następny krok.</span></footer></section>`}
function taskRows(){return taskData.map((t,i)=>({t,i})).filter(({t})=>(filter==='all'||t.state===filter)&&t.title.toLowerCase().includes(query.toLowerCase())).map(({t,i})=>`<button class="task ${i===selected?'selected':''}" data-task="${i}" aria-pressed="${i===selected}"><div class="task-top"><span class="project"><i></i>${t.project}</span><span class="badge ${t.state==='running'?'amber':t.state==='done'?'green':''}">${t.label}</span></div><h3>${t.title}</h3><div class="task-bottom"><span class="agent">${t.agent==='Codex'?'C':'✳'}</span>${t.agent}<span>·</span><span>#${128-i}</span><time>${t.time}</time></div>${t.state==='running'?'<div class="progress"></div>':''}</button>`).join('')||'<p class="list-caption">Brak pasujących zadań.</p>'}
function detail(){const t=taskData[selected];return `<div class="detail-head"><div class="detail-meta"><span>ZADANIE #${128-selected} <span class="slash">/</span> ${t.agent}</span><span class="badge ${t.state==='running'?'amber':t.state==='done'?'green':''}">${t.label}</span></div><h2>${t.title}</h2><p class="detail-desc">${t.desc}</p></div><div class="detail-tabs">${[['changes','Zmiany'],['tests','Testy'],['activity','Aktywność']].map(([id,title])=>`<button class="tab ${detailTab===id?'active':''}" data-detail="${id}">${title}${id==='changes'&&selected===0?' <span>3 pliki</span>':''}</button>`).join('')}</div><div class="detail-body">${selected===0?detailContent():`<div class="review-note">${I(t.state==='running'?'activity':'check')} ${t.state==='running'?'Praca w toku · oczekiwanie na wynik agenta':t.state==='review'?'Raport jest gotowy do przeglądu.':'Zadanie zakończone.'}</div><p style="font-size:12px;margin-top:18px">To przykładowy stan zadania w nowym układzie. Pełny diff prezentuje pierwsze zadanie na liście.</p>`}</div><div class="detail-foot"><button class="btn secondary" data-demo="Podgląd: odrzucenie zadania wymagałoby potwierdzenia.">Odrzuć</button><button class="btn" data-demo="Podgląd miejsca na uwagi do agenta.">Poproś o poprawki</button><button class="btn primary" data-demo="To makieta — żadne zmiany nie zostały scalone.">${I('check')} Zatwierdź zmiany</button></div>`}
function detailContent(){if(detailTab==='tests')return '<div class="checks"><span class="check">'+I('check')+' 14 / 14 testów</span></div><pre style="padding:16px">Przykładowy wynik testów\n\n✓ Przywracanie rozmiaru\n✓ Przywracanie położenia\n✓ Zamknięcie do zasobnika\n\n14 passed · 1.24 s</pre>';if(detailTab==='activity')return '<p style="font-size:12px;line-height:2.6">10:32 · Zadanie rozpoczęte<br>10:33 · Zmodyfikowano 3 pliki<br>10:34 · Testy zakończone<br>10:34 · Recenzja gotowa do sprawdzenia</p>';return `<div class="checks"><span class="check">${I('check')}14 / 14 testów</span><span class="check">${I('shield')}Recenzja bez uwag</span><span class="check">${I('check')}Brak konfliktów</span></div><div class="filebar"><span>src / dia / appwindow.py</span><span>+18 <span style="color:var(--red)">−2</span></span></div><pre aria-label="Przykładowy fragment zmian"><span class="code-line"><span class="line-no">84</span> def restore_window(self):</span><span class="code-line del"><span class="line-no">85</span>−    self.resize(1200, 800)</span><span class="code-line add"><span class="line-no">85</span>+    geometry = self.settings.value(</span><span class="code-line add"><span class="line-no">86</span>+        "window/geometry"</span><span class="code-line add"><span class="line-no">87</span>+    )</span><span class="code-line add"><span class="line-no">88</span>+    if geometry:</span><span class="code-line add"><span class="line-no">89</span>+        self.restoreGeometry(geometry)</span><span class="code-line"><span class="line-no">90</span> </span></pre><div class="review-note">${I('book')}Zapis stanu działa także po zamknięciu do zasobnika.</div>`}
function chat(){return `<div class="chatlayout"><aside class="conversations"><button class="btn" data-action="conversation">${I('plus')} Nowa rozmowa</button><div class="nav-label">DZISIAJ</div><button class="conversation active" data-demo="Otwarta rozmowa: praca nad Dią.">Praca nad Dią<small>Ustawienia i interfejs</small></button><button class="conversation" data-demo="Podgląd listy rozmów — przykładowa historia.">Pomysły na kolejną wersję<small>09:41 · 6 wiadomości</small></button><div class="nav-label" style="margin-top:25px">WCZORAJ</div><button class="conversation" data-demo="Podgląd listy rozmów — przykładowa historia.">Przegląd projektu<small>Podsumowanie zmian</small></button></aside><div class="chat-main"><div class="chat-title"><div><h2>Praca nad Dią</h2><small>Rozmowa z kontekstem Twojego projektu</small></div><span class="badge"><i class="dot"></i> Dia · automatycznie</span></div><div class="messages" id="messages"><div class="message user">Co jeszcze zostało do zrobienia z oknem aplikacji?</div><div class="message"><div class="speaker"><img src="${logo}" alt=""> <b>Dia</b><small>10:34</small></div><p>Zapamiętywanie rozmiaru okna jest gotowe do sprawdzenia. Wszystkie 14 testów przeszło, a recenzja nie wykazała uwag.</p><div class="inline-card"><div class="project"><i></i>Dia <span class="slash">/</span> ZADANIE #128</div><h3>Zapamiętywanie rozmiaru okna</h3><div class="checks" style="margin:0 0 14px"><span class="check">${I('check')}14 testów</span><span class="check">${I('shield')}Recenzja bez uwag</span></div><button class="btn" data-view="tasks">Sprawdź zmiany ${I('arrow')}</button></div><p>Do sprawdzenia pozostają:</p><ul><li>przywracanie położenia przy dwóch monitorach,</li><li>zachowanie po odłączeniu zewnętrznego ekranu.</li></ul><p>Mogę przygotować plan weryfikacji tych dwóch przypadków.</p></div></div><form class="composer" id="chat-form"><textarea id="chat-input" aria-label="Wiadomość do Dii" placeholder="Zapytaj lub zleć coś Dii…"></textarea><div class="composer-actions"><button type="button" class="icon" data-demo="Miejsce na dodawanie kontekstu do rozmowy." aria-label="Dodaj załącznik">${I('clip')}</button><span class="badge">Dia</span><small>Projekt: Dia</small><button type="submit" class="btn primary" aria-label="Wyślij wiadomość">${I('up')}</button></div></form><div class="chat-hint">Makieta · wiadomości pozostają tylko w tym podglądzie</div></div></div>`}
function settings(){return `<section class="page"><div class="heading"><div><div class="eyebrow">PO TWOJEMU</div><h1>Ustawienia</h1><p>Twoja Dia. Twój sposób pracy.</p></div><span class="badge green">Zapis lokalny · podgląd</span></div><div class="settingsgrid"><nav class="settingsnav" aria-label="Kategorie ustawień">${['Ogólne','Głos i modele','Agenci','Projekty','Pamięć','Automatyzacja','Integracje','Wygląd i aplikacja','Prywatność'].map(n=>`<button class="${n==='Wygląd i aplikacja'?'active':''}" ${n==='Wygląd i aplikacja'?'aria-current="page"':''} data-demo="Makieta prezentuje kategorię: Wygląd i aplikacja.">${n}</button>`).join('')}</nav><div class="settingscontent"><h2>Wygląd i aplikacja</h2><p>Wybierz motyw i zachowanie okna na pulpicie.</p><div class="label" style="font-size:12px">Motyw interfejsu</div><div class="themes"><button class="theme selected" data-theme="dark"><div class="theme-preview"></div>Grafit</button><button class="theme light" data-theme="light"><div class="theme-preview"></div>Jasny</button><button class="theme midnight" data-theme="midnight"><div class="theme-preview"></div>Midnight</button></div><h2 style="font-size:14px;margin-bottom:15px">Okno i zasobnik</h2><div class="settingbox">${[['Własny pasek tytułu','Spójny wygląd okna z resztą aplikacji.',true],['Minimalizuj do zasobnika','Dia pozostaje dostępna w tle.',true],['Zamknięcie okna ukrywa aplikację','Zakończ pracę Dii z menu ikony w zasobniku.',true]].map(([title,desc,on])=>`<div class="settingrow"><div><b>${title}</b><small>${desc}</small></div><button class="switch" role="switch" aria-label="${title}" aria-checked="${on}"></button></div>`).join('')}</div><h2 style="font-size:14px;margin-bottom:15px">Uruchamianie</h2><div class="settingbox"><div class="settingrow"><div><b>Uruchamiaj po zalogowaniu</b><small>Rozpocznij dzień z Dią gotową do pracy.</small></div><button class="switch" role="switch" aria-label="Uruchamiaj po zalogowaniu" aria-checked="false"></button></div><div class="settingrow"><div><b>Usługi lokalne</b><small>Dia i Ollama · przykładowy stan</small></div><button class="btn" data-demo="Podgląd zarządzania usługami. Usługi systemowe nie są zmieniane.">Zarządzaj ${I('arrow')}</button></div></div><p class="setting-caption">Przełączniki pokazują zachowanie interfejsu. Nie zmieniają konfiguracji Dii.</p></div></div><footer class="footer"><span class="demo-label">Koncepcja UI · przykładowe dane</span><span>Wygląd i aplikacja / 01</span></footer></section>`}
function notify(msg){const el=document.querySelector('#toast');el.textContent=msg;el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,3500)}
function bind(){document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{if(['tasks','chat','settings'].includes(el.dataset.view)){view=el.dataset.view;location.hash=view;render()}else notify('Makieta obejmuje Zadania, Rozmowy i Ustawienia.')});document.querySelectorAll('[data-demo]').forEach(el=>el.onclick=()=>notify(el.dataset.demo));document.querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>{filter=el.dataset.filter;render()});document.querySelectorAll('[data-task]').forEach(el=>el.onclick=()=>{selected=Number(el.dataset.task);render()});document.querySelectorAll('[data-detail]').forEach(el=>el.onclick=()=>{detailTab=el.dataset.detail;render()});document.querySelectorAll('.switch').forEach(el=>el.onclick=()=>{el.setAttribute('aria-checked',el.getAttribute('aria-checked')==='true'?'false':'true');notify('Zmieniono stan przełącznika w podglądzie.')});document.querySelectorAll('[data-theme]').forEach(el=>el.onclick=()=>{document.body.classList.toggle('light-mode',el.dataset.theme==='light');document.querySelectorAll('.theme').forEach(b=>b.classList.toggle('selected',b===el));notify(el.dataset.theme==='midnight'?'Midnight: próbka palety. Pełny podgląd dostępny dla Grafitu i Jasnego.':'Zmieniono motyw podglądu.')});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{const a=el.dataset.action;if(a==='theme')document.body.classList.toggle('light-mode');if(a==='search'){if(view!=='tasks'){view='tasks';location.hash=view;render()}document.querySelector('#task-search').focus()}if(a==='new'||a==='conversation'){view='chat';location.hash=view;render();if(a==='conversation'){document.querySelector('#messages').innerHTML='';document.querySelector('.chat-title h2').textContent='Nowa rozmowa'}else document.querySelector('#chat-input').value='Przygotuj zadanie: ';document.querySelector('#chat-input').focus()}});const search=document.querySelector('#task-search');if(search)search.oninput=()=>{query=search.value;document.querySelector('#tasklist').innerHTML=taskRows();document.querySelectorAll('[data-task]').forEach(el=>el.onclick=()=>{selected=Number(el.dataset.task);render()})};const form=document.querySelector('#chat-form');if(form)form.onsubmit=e=>{e.preventDefault();const input=document.querySelector('#chat-input');if(!input.value.trim())return;const message=document.createElement('div');message.className='message user';message.textContent=input.value;document.querySelector('#messages').append(message);input.value='';notify('Wiadomość dodana do makiety. Asystent nie jest połączony.')}}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();view='tasks';location.hash=view;render();document.querySelector('#task-search').focus()}});window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(['tasks','chat','settings'].includes(next)&&view!==next){view=next;render()}});render();
</script>
</body></html>
